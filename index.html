<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hwan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Hwan: photographs of Japan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-screen cinematic opening (living photo, bottom blur, glass controls), then the work grouped by category, every photo shown whole at its own proportions and drawn through WebGL so it bends as you scroll, and a lightbox. Single black look on purpose: photos read best on black. */
:root {
  --ground: #000;
  --ground-2: #111;
  --paper: #fff;
  --dim: #9ca3af;
  --rule: #1f2937;
  --leader: #d1d5db;
  --display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2,.7,.1,1);
  color-scheme: dark;
}
html { background: var(--ground); }
body { margin: 0; background: var(--ground); color: var(--paper); font-family: var(--display); font-size: 14px; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
a { color: inherit; }
::selection { background: var(--leader); color: var(--ground); }
:focus-visible { outline: 1px solid var(--leader); outline-offset: 3px; }

/* ——— liquid glass ——— */
.liquid-glass {
  background: rgba(255, 255, 255, .01); background-blend-mode: luminosity;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  border: none; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .1);
  position: relative; overflow: hidden; color: #fff;
}
.liquid-glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,.15) 80%, rgba(255,255,255,.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}

/* ——— blur-fade-up entrance ——— */
@keyframes blurFadeUp {
  from { opacity: 0; filter: blur(20px); transform: translateY(40px); }
  to { opacity: 1; filter: blur(0); transform: translateY(0); }
}
.animate-blur-fade-up { opacity: 0; animation: blurFadeUp 1s ease-out forwards; }

/* ——— cinematic hero ——— */
.hero { position: relative; height: 100vh; height: 100svh; min-height: 560px; overflow: hidden; display: flex; flex-direction: column; background: #000; }
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg img {
  position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 50% 40%;
  opacity: 0; filter: blur(16px); transform: scale(1.06);
  transition: opacity 1.4s ease-out, filter 1.4s ease-out;
}
.hero-bg img.on { opacity: 1; filter: blur(0); animation: drift 22s ease-out forwards; }
@keyframes drift { from { transform: scale(1.06); } to { transform: scale(1.16); } }
.hero-gl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0; transition: opacity 1.2s ease-out; pointer-events: none; }
.hero-gl.on { opacity: 1; }
.hero-blur {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  -webkit-mask-image: linear-gradient(to top, black 0%, transparent 45%); mask-image: linear-gradient(to top, black 0%, transparent 45%);
}

.nav {
  position: relative; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
.logo { display: flex; align-items: center; height: 32px; font-size: 18px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
.nav-links { display: flex; gap: 36px; }
/* phones use the same Work | HWAN | Contact bar as desktop; the extra menu and grid buttons only repeated the hero links */
html .menu-btn, html .mobile-menu, html .nav-side .grid-btn { display: none; }
@media (max-width: 767px) { .nav-links a { display: inline-block; padding: 10px 4px; font-size: 15px; } }
.nav-links a { font-size: 14px; text-decoration: none; transition: color .2s; }
.nav-links a:hover { color: #d1d5db; }
.nav-side { display: flex; align-items: center; gap: 12px; }
.nav-side.end { justify-content: flex-end; }
.pill, .circle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
.pill { padding: 8px 16px; }
.circle { width: 40px; height: 40px; padding: 0; }
.menu-btn .ico { position: absolute; transition: transform .5s ease-out, opacity .5s ease-out; }
.menu-btn .ico-x { transform: rotate(-180deg) scale(.5); opacity: 0; }
.menu-btn[aria-expanded="true"] .ico-menu { transform: rotate(180deg) scale(.5); opacity: 0; }
.menu-btn[aria-expanded="true"] .ico-x { transform: none; opacity: 1; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.mobile-menu {
  position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 72px); z-index: 40;
  background: rgb(17 24 39 / .95); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-block: 1px solid #1f2937; box-shadow: 0 25px 50px -12px rgb(0 0 0 / .25);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  transition: transform .5s ease-out, opacity .5s ease-out;
  transform: translateY(-16px); opacity: 0; pointer-events: none;
}
.mobile-menu.open { transform: none; opacity: 1; pointer-events: auto; }
.mobile-menu a.m-link { display: block; padding: 12px; border-radius: 8px; font-size: 16px; text-decoration: none; transition: background .2s, transform .5s ease-out, opacity .5s ease-out; transform: translateX(-16px); opacity: 0; }
.mobile-menu.open a.m-link { transform: none; opacity: 1; }
.mobile-menu a.m-link:hover { background: rgb(31 41 55 / .5); }
.mobile-menu .m-actions { display: flex; gap: 12px; margin-top: 12px; padding-top: 16px; border-top: 1px solid #1f2937; }

.hero-content { position: absolute; inset: 0; z-index: 10; pointer-events: none; text-align: center; }
.hero-content a, .hero-content button { pointer-events: auto; }
.mirror { position: absolute; left: 0; right: 0; top: var(--wl, 60%); height: 0; padding-inline: 16px; }
.mirror .hero-title { position: absolute; left: 16px; right: 16px; bottom: 0; margin: 0; padding-bottom: .04em; }
.reflect { position: absolute; left: 16px; right: 16px; top: 0; }
.reflect .hero-title {
  position: static; transform: scaleY(-1); transform-origin: 50% 0; translate: 0 100%; opacity: .26; filter: url(#ripple) blur(.6px);
  -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 75%); mask-image: linear-gradient(to top, #000 0%, transparent 75%);
}
.mirror.dry .reflect { display: none; }
/* every few seconds a wave runs through the headline, and its reflection answers */
.hero-title .w { display: inline-block; white-space: nowrap; }
.hero-title .ch { display: inline-block; }
.mirror.out .ch, .mirror.in .ch { will-change: transform, filter, opacity; animation-delay: calc(var(--i) * 24ms); }
.mirror.out .ch { animation: lineOut .8s ease-in both; }
.mirror.in .ch { animation: lineIn 1s ease-out both; }
@keyframes lineOut { to { opacity: 0; filter: blur(8px); transform: translateY(.08em) scale(.96); } }
@keyframes lineIn { from { opacity: 0; filter: blur(8px); transform: translateY(.08em) scale(.96); } }
@media (prefers-reduced-motion: reduce) { .mirror .ch { animation: none !important; } }
/* phones: the same look with less work per frame */
html.lite .hero-blur { -webkit-backdrop-filter: none; backdrop-filter: none; background: linear-gradient(to top, rgb(0 0 0 / .42) 0%, rgb(0 0 0 / .12) 28%, transparent 45%); }
html.lite .liquid-glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255, 255, 255, .08); }
html.lite .reflect .hero-title { filter: blur(.6px); }
html.lite .mirror.out .ch { animation-name: lineOutLite; }
html.lite .mirror.in .ch { animation-name: lineInLite; }
@keyframes lineOutLite { to { opacity: 0; transform: translateY(.08em) scale(.96); } }
@keyframes lineInLite { from { opacity: 0; transform: translateY(.08em) scale(.96); } }
html.lite .gate { transition: opacity .9s var(--ease); }
.hero-foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 28px); }
/* keep the buttons clear of the music toggle on narrow screens */
@media (max-width: 640px) { .hero-foot { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); } }
.meta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; font-size: 12px; color: #d1d5db; }
.meta-row span { display: inline-flex; align-items: center; gap: 6px; transition: opacity .5s ease-out; }
.meta-row svg.i { width: 16px; height: 16px; }
.meta-row b { font-weight: 500; }
.hero-title { margin: 0; font-size: 30px; line-height: 1.05; font-weight: 400; letter-spacing: -.04em; text-wrap: balance; }
.hero-desc { margin: 0 auto 24px; font-size: 16px; line-height: 1.5; color: #d1d5db; max-width: 42rem; text-shadow: 0 1px 12px rgb(0 0 0 / .25); text-wrap: pretty; }
.ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.cta { padding: 10px 24px; font-weight: 500; }
.cta-solid { background: #fff; color: #000; border: 0; transition: background .2s; }
.cta-solid:hover { background: #e5e7eb; }
.cta-solid svg.i { fill: #000; stroke: #000; }

@media (min-width: 640px) {
  .nav { padding-inline: max(24px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-right, 0px)); }
  .mobile-menu .m-actions { display: none; }
  .meta-row { gap: 24px; font-size: 14px; }
  .meta-row svg.i { width: 20px; height: 20px; }
  .hero-title { font-size: 48px; }
  .hero-desc { font-size: 18px; }
  .ctas { gap: 16px; }
  .cta { padding: 12px 32px; }
}
@media (min-width: 768px) {
  .nav { padding: calc(env(safe-area-inset-top, 0px) + 24px) max(48px, env(safe-area-inset-right, 0px)) 24px max(48px, env(safe-area-inset-left, 0px)); }
  .logo { height: 40px; font-size: 20px; }
  .pill { padding: 8px 24px; }
  .hero-foot { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .hero-title { font-size: 60px; }
  .hero-desc { font-size: 20px; margin-bottom: 32px; }
}
@media (min-width: 1024px) {
  .nav-links { display: flex; }
  .nav-side .nav-links:first-child { margin-left: 0; }
  .menu-btn, .mobile-menu, .nav-side .grid-btn { display: none; }
  .hero-title { font-size: 72px; }
}

/* ——— work: categories ——— */
.work { padding: 14vh var(--gutter-r) 10vh var(--gutter-l); overflow-x: clip; }
.work-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px; padding-inline: 8px; margin-bottom: 28px; }
.work-head h2 { margin: 0; font-weight: 300; font-size: clamp(40px, 7vw, 112px); line-height: .95; letter-spacing: -.045em; }
.work-head h2 b { font-weight: 500; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; padding-inline: 8px; margin-bottom: 40px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 20; }
.tab { padding: 9px 18px; font-size: 14px; color: #d1d5db; background-color: rgb(0 0 0 / .35); }
.tab sup { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--dim); margin-left: 4px; vertical-align: super; }
.tab[aria-pressed="true"] { background: #fff; color: #000; }
.tab[aria-pressed="true"] sup { color: #4b5563; }
.tab[aria-pressed="true"]::before { display: none; }

.cat { margin-bottom: 12vh; }
.cat-head { position: relative; z-index: 6; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 0 8px 18px; border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
.cat-head h3 { margin: 0; font-weight: 400; font-size: clamp(26px, 3.4vw, 44px); letter-spacing: -.035em; }
.cat-head span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--dim); font-variant-numeric: tabular-nums; }

.reel { display: flex; flex-direction: column; align-items: center; gap: clamp(72px, 16vh, 180px); padding-top: 6vh; }
.item { margin: 0; width: min(100%, calc(84svh * var(--r)), 1440px); display: grid; gap: 14px; }
/* panoramas run the full width of the screen, edge to edge */
.item.wide { width: 100vw; max-width: none; }
.item.wide .note { padding-inline: var(--gutter-l) var(--gutter-r); }
.frame {
  position: relative; margin: 0; padding: 0; border: 0; background: var(--tone, var(--ground-2));
  aspect-ratio: var(--r); width: 100%; max-width: 100%; cursor: zoom-in; overflow: hidden; display: block;
}
.frame img { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .9s var(--ease); }
.frame img.loaded { opacity: 1; }
.work.gl .frame { background: transparent; }
.work.gl .frame img { visibility: hidden; }
.item figcaption:not(.note) {
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  font-family: var(--mono); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums;
}
.item figcaption:not(.note) b { color: var(--paper); font-weight: 500; }
.note { position: relative; z-index: 6; display: grid; grid-template-columns: auto 1fr; column-gap: 18px; row-gap: 8px; padding: 6px 8px 0; max-width: 64ch; }
.note .n { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--dim); padding-top: .55em; font-variant-numeric: tabular-nums; }
.note h4 { margin: 0; font-weight: 400; font-size: clamp(20px, 2vw, 26px); letter-spacing: -.025em; line-height: 1.15; }
.note p { grid-column: 2; margin: 0; color: #d1d5db; font-size: 15px; line-height: 1.6; text-wrap: pretty; }
.lb-note { padding: 4px 8px 6px; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 18px; row-gap: 4px; }
.lb-note h4 { margin: 0; font-weight: 400; font-size: 20px; letter-spacing: -.02em; }
.lb-note p { margin: 0; color: #d1d5db; font-size: 14px; line-height: 1.5; max-width: 70ch; }
.warp { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
@media (max-width: 640px) {
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -8px; padding: 2px 16px; margin-bottom: 28px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; }
}

/* ——— footer ——— */
.foot {
  border-top: 1px solid var(--rule);
  padding: 12vh var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 28px) var(--gutter-l);
  display: grid; gap: 48px;
}
.foot h2 {
  margin: 0; padding-inline: 8px; font-family: var(--display); font-weight: 400;
  font-size: clamp(44px, 10vw, 168px); line-height: .95; letter-spacing: -.045em; text-wrap: balance;
}
.foot h2 span { font-weight: 300; color: var(--dim); }
/* the closing line: run the cursor through it and the letters fill with pixelated photographs */
.foot h2 { position: relative; }
.foot h2 canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
.foot h2.painted, .foot h2.painted span { color: transparent; }
.foot .ig { display: inline-flex; align-items: center; gap: 8px; color: var(--paper); text-decoration: none; }
.foot .ig svg.i { width: 15px; height: 15px; }
.foot .ig:hover { color: #d1d5db; }
.foot .small { font-family: var(--mono); padding-inline: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; }

/* ——— entrance: one tap to come in, which is also the browser's permission to play sound ——— */
.gate { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgb(0 0 0 / .38);
  -webkit-backdrop-filter: blur(18px) saturate(1.1); backdrop-filter: blur(18px) saturate(1.1); transition: opacity .9s var(--ease), backdrop-filter .9s var(--ease); }
.gate[hidden] { display: none; }
.gate.out { opacity: 0; pointer-events: none; }
.gate-in { display: grid; justify-items: center; gap: 22px; text-align: center; padding: 24px; animation: blurFadeUp 1s ease-out both; }
.gate-name { font-size: 15px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; margin-bottom: 10px; }
.gate-go { padding: 12px 28px; font-size: 15px; font-weight: 500; }
.gate-quiet { background: none; border: 0; color: #d1d5db; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgb(255 255 255 / .3); }
.gate-quiet:hover { color: #fff; }
html.gated .hero .animate-blur-fade-up { animation-play-state: paused; }

/* ——— music toggle: four bars that dance while it plays, lie flat when it doesn't ——— */
.to-top { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); z-index: 45; width: 44px; height: 44px; border: 0;
  opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .5s var(--ease), transform .5s var(--ease); }
.to-top.on { opacity: 1; transform: none; pointer-events: auto; }
.sound { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 45; width: 44px; height: 44px; color: var(--paper); border: 0; }
.sound .bars { display: flex; align-items: flex-end; gap: 3px; height: 14px; }
.sound i { display: block; width: 2px; height: 3px; background: currentColor; border-radius: 1px; transition: height .4s var(--ease); }
.sound[aria-pressed="true"] i { animation: eq 1.1s ease-in-out infinite alternate; }
.sound[aria-pressed="true"] i:nth-child(2) { animation-delay: -.4s; } .sound[aria-pressed="true"] i:nth-child(3) { animation-delay: -.8s; } .sound[aria-pressed="true"] i:nth-child(4) { animation-delay: -.2s; }
@keyframes eq { 0% { height: 3px; } 50% { height: 14px; } 100% { height: 6px; } }
@media (prefers-reduced-motion: reduce) { .sound[aria-pressed="true"] i { animation: none; height: 10px; } }

/* ——— cursor ——— */
.cursor { font-family: var(--mono);
  position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none;
  width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%;
  display: grid; place-items: center; background: var(--paper); color: var(--ground);
  text-transform: uppercase; letter-spacing: .14em; font-size: 10px; font-weight: 500;
  transform: translate3d(var(--cx, -200px), var(--cy, -200px), 0) scale(var(--cs, 0));
  transition: transform .35s var(--ease);
}
@media (hover: none), (pointer: coarse) { .cursor { display: none; } }

/* ——— lightbox ——— */
.lb {
  position: fixed; inset: 0; z-index: 50; background: var(--ground);
  display: grid; grid-template-rows: auto 1fr auto auto;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 14px) var(--gutter-l);
  opacity: 0; visibility: hidden; transition: opacity .45s var(--ease), visibility 0s .45s;
}
.lb.open { opacity: 1; visibility: visible; transition: opacity .45s var(--ease); }
.lb-top, .lb-meta { font-family: var(--mono); display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-inline: 8px; text-transform: uppercase; letter-spacing: .14em; font-size: 11px; }
.lb-top .count { font-variant-numeric: tabular-nums; }
.lb button { background: none; border: 0; color: var(--paper); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 8px; }
.lb button:hover { color: var(--leader); }
.lb-stage { position: relative; min-height: 0; touch-action: pan-y; }
.lb-stage img {
  position: absolute; inset: 12px 0; width: 100%; height: calc(100% - 24px); max-width: 100%; object-fit: contain;
  transition: opacity .5s var(--ease), transform .7s var(--ease);
}
.lb-stage img.out { opacity: 0; transform: scale(.985); }
.lb-stage .prev, .lb-stage .next { position: absolute; top: 0; bottom: 0; width: 30%; padding: 0; }
.lb-stage .prev { left: 0; cursor: w-resize; } .lb-stage .next { right: 0; cursor: e-resize; }
.lb-meta { color: var(--dim); flex-wrap: wrap; justify-content: flex-start; column-gap: 22px; row-gap: 4px; min-height: 30px; font-variant-numeric: tabular-nums; }
.lb-meta b { color: var(--paper); font-weight: 500; }
.strip { display: flex; gap: 4px; overflow-x: auto; padding: 10px 8px 0; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: none; padding: 0; height: 48px; opacity: .35; transition: opacity .3s; }
.strip button.cur, .strip button:hover { opacity: 1; }
.strip img { height: 100%; width: auto; display: block; }
/* photos can't be dragged out, long-pressed to save, or selected */
img, canvas { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.hero-bg img, .frame img, .lb-stage img, .strip img { pointer-events: none; }

.empty { padding: 30vh 8px; text-align: center; color: var(--dim); text-transform: uppercase; letter-spacing: .14em; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, "0");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mobile = matchMedia("(max-width: 640px)");
  // phones and tablets get a lighter build of every effect
  const lite = matchMedia("(pointer: coarse)").matches || innerWidth < 820 || (navigator.deviceMemory || 8) <= 4;
  document.documentElement.classList.toggle("lite", lite);
  $("#year").textContent = new Date().getFullYear();
  // no right-click "save image" and no dragging photos out of the page
  const guarded = (t) => t.closest && t.closest("img, canvas, .frame, .lb-stage, .strip, .hero, .work");
  document.addEventListener("contextmenu", (e) => { if (guarded(e.target)) e.preventDefault(); });
  document.addEventListener("dragstart", (e) => { if (guarded(e.target)) e.preventDefault(); });
  // back-to-top arrow: appears while you scroll down the page, fades a moment after you stop
  const toTop = $("#toTop"); let topTimer = 0, topHeld = false;
  const hideTop = () => { if (!topHeld) toTop.classList.remove("on"); };

    toTop.classList.toggle("on", scrollY > innerHeight * .8);

  }, { passive: true });
  toTop.addEventListener("pointerenter", () => { topHeld = true; });
  toTop.addEventListener("pointerleave", () => { topHeld = false; clearTimeout(topTimer); topTimer = setTimeout(hideTop, 1400); });
  toTop.addEventListener("click", () => { scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); });

  // the site's name lives here (and in <title>)
  const SITE_NAME = "Hwan";
  document.querySelectorAll("[data-site-name]").forEach((el) => el.textContent = SITE_NAME);

  /* ——— mobile menu ——— */
  const menuBtn = $("#menuBtn"), menu = $("#mobileMenu");
  const setMenu = (open) => { menuBtn.setAttribute("aria-expanded", open); menu.classList.toggle("open", open); };
  menuBtn.addEventListener("click", () => setMenu(menuBtn.getAttribute("aria-expanded") !== "true"));
  menu.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });

  let all = [];
  try { all = await (await fetch("photos.json", { cache: "no-cache" })).json(); } catch (e) { all = []; }
  if (!all.length) {
    $("#cats").innerHTML = '<p class="empty">Photographs are on their way.</p>';
    return;
  }
  const shots = all.filter((p) => p.kind !== "poster");

  /* ——— cinematic hero: featured photos with previous / next ——— */
  const ICON = {"camera": "<path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z\"/><circle cx=\"12\" cy=\"13\" r=\"3\"/>", "aperture": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"m14.31 8 5.74 9.94\"/><path d=\"M9.69 8h11.48\"/><path d=\"m7.38 12 5.74-9.94\"/><path d=\"M9.69 16 3.95 6.06\"/><path d=\"M14.31 16H2.83\"/><path d=\"m16.62 12-5.74 9.94\"/>", "clock": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><polyline points=\"12 6 12 12 16 14\"/>", "calendar": "<path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/>"};
  const svg = (k) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
  const bg = $("#heroBg"), heroMeta = $("#heroMeta");
  let heroPicks = shots.filter((p) => "hero" in p).sort((a, b) => a.hero - b.hero);
  if (!heroPicks.length) heroPicks = shots.slice(0, 1);
  heroPicks = heroPicks.slice(0, 1); // the landing page is the one photo
  const heroImgs = heroPicks.map((p, i) => {
    const im = new Image(); im.alt = ""; im.decoding = "async";
    if (i === 0) { im.src = lite && p.mid ? p.mid : p.src; im.className = "on"; } else { im.dataset.src = p.src; }
    bg.appendChild(im); return im;
  });
  let heroIdx = 0;
  function heroInfo(p) {
    const bits = [
      p.camera && `<span>${svg("camera")}<b>${p.camera}</b></span>`,
      (p.focal || p.aperture) && `<span>${svg("aperture")}${[p.focal, p.aperture].filter(Boolean).join(" · ")}</span>`,
      p.shutter && `<span>${svg("clock")}${p.shutter}${p.iso ? " · " + p.iso : ""}</span>`,
    ].filter(Boolean);
    if (heroMeta) heroMeta.innerHTML = bits.join("");
  }
  function showHero(i) {
    const next = (i + heroImgs.length) % heroImgs.length;
    if (next === heroIdx) return;
    const im = heroImgs[next];
    if (im.dataset.src) { im.src = im.dataset.src; delete im.dataset.src; }
    const go = () => {
      heroImgs[heroIdx].classList.remove("on");
      heroIdx = next; im.classList.add("on"); heroInfo(heroPicks[heroIdx]);
      living && living.show(heroPicks[heroIdx], im);
    };
    im.decode ? im.decode().then(go, go) : go();
  }
  /* ——— living photo: the lake moves, light drifts, the water answers the cursor ——— */
  const living = (() => {
    const cv = $("#heroGl");
    const gl = !reduce && cv.getContext("webgl", { premultipliedAlpha: false, antialias: false });
    if (!gl) return null;
    const VS = "attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}";
    const FS = (lite ? "#define LITE\n#define OCT 3\n" : "#define OCT 5\n") + `precision highp float;
varying vec2 v;
uniform sampler2D T; uniform vec2 R; uniform float A, W, t; uniform vec2 M; uniform float Mi;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<OCT;i++){s+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
// clouds drift across the sky above the mountain; patches gather and thin out, so they come and go
float cloud(vec2 p, float t){
  vec2 q = vec2(p.x*2.6 - t*.025, p.y*7.);
#ifdef LITE
  float n = fbm(q + vec2(sin(q.y*.9 + t*.01)*.4, 0.));
#else
  float n = fbm(q + vec2(fbm(q*.6 + t*.01)*.8, 0.));
#endif
  float come = .5 + .5*sin(p.x*1.9 - t*.021 + 2.*sin(t*.013));   // where the sky is busy right now
  float a = smoothstep(.74 - .32*come, 1. - .32*come, n);
  float band = smoothstep(.0, .1, p.y)*(1. - smoothstep(.24, .34, p.y));
  return a*band;
}
void main(){
  vec2 s = vec2(v.x, 1.-v.y);                       // screen, top = 0
  float sa = R.x/R.y;
  vec2 sc = sa > A ? vec2(1., A/sa) : vec2(sa/A, 1.);
  float z = 1.05 + .02*sin(t*.07);                 // slow breathing zoom
  vec2 fo = vec2(.5, .4);                           // object-position 50% 40%
  vec2 uv = (s - .5)*sc/z + .5 + (fo - .5)*(1. - sc/z) + (M - .5)*.012;
  float d = clamp((uv.y - W)/(1. - W), 0., 1.);     // depth into the water
  float on = smoothstep(W, W + .012, uv.y);
  // layered swell: long slow rolls plus fine chop, stronger toward the viewer
  float sw = sin(uv.y*160. - t*1.3 + sin(uv.x*9. + t*.45)*1.6)*.0016
           + sin(uv.y*420. - t*2.3 + uv.x*20.)*.0006
           + sin(uv.x*38. + uv.y*60. + t*.9)*.0007;
  // a ring of ripples that follows the pointer across the lake
  vec2 q = (s - M)*vec2(sa, 1.);
  float r = length(q);
  float ring = Mi*sin(r*90. - t*5.)*exp(-r*7.)*.006;
  vec2 off = vec2(sw*(.35 + 1.4*d) + ring, sw*.55*d + ring*.6)*on;
  vec3 c = texture2D(T, clamp(uv + off, .001, .999)).rgb;
  // clouds in the sky, and their faint reflection in the lake
  float ca = cloud(uv, t)*(1. - on);
  float cr = cloud(vec2(uv.x + off.x*3., 2.*W - uv.y), t)*on*(1. - d)*.35;
  c = mix(c, vec3(.96, .975, 1.)*(.92 + .08*(1. - uv.y*3.)), ca*.88);
  c = mix(c, c + .22, cr);
  // glints on the water, sparse and soft
  float g = pow(max(0., sin(uv.x*520. + t*2.1)*sin(uv.y*900. - t*3.3)), 18.)*on*(1. - d*.5);
  c += g*.22;
  // light drifting across sky and slope
  float sky = 1. - on;
  c *= 1. + sky*.05*sin(uv.x*3. - t*.18 + uv.y*2.);
  // fine film grain
  c += (h(s*R + fract(t)*91.) - .5)*.012;
  gl_FragColor = vec4(c, 1.);
}`;
    const mk = (type, src) => { const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null; };
    const vs = mk(gl.VERTEX_SHADER, VS), fs = mk(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) return null;
    const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = (n) => gl.getUniformLocation(pr, n);
    const u = { R: U("R"), A: U("A"), W: U("W"), t: U("t"), M: U("M"), Mi: U("Mi") };
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([k, val]) => gl.texParameteri(gl.TEXTURE_2D, k, val));

    let photo = null, raf = 0, running = false, visible = true;
    const mouse = { x: .5, y: .62, tx: .5, ty: .62, i: 0, ti: 0 };
    const heroEl = $(".hero");
    heroEl.addEventListener("pointermove", (e) => {
      const r = heroEl.getBoundingClientRect();
      mouse.tx = (e.clientX - r.left) / r.width; mouse.ty = (e.clientY - r.top) / r.height; mouse.ti = 1;
    }, { passive: true });
    heroEl.addEventListener("pointerleave", () => { mouse.ti = 0; });
    new IntersectionObserver((es) => { visible = es[0].isIntersecting; if (visible) start(); }).observe(heroEl);

    function size() {
      const dpr = lite ? Math.min(devicePixelRatio || 1, 1.5) : Math.min(devicePixelRatio || 1, 1.75);
      const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    }
    addEventListener("resize", size);
    const t0 = performance.now(); let last = 0;
    function frame(now) {
      if (!photo || !visible) { running = false; return; }
      if (lite && now - last < 30) { raf = requestAnimationFrame(frame); return; }
      last = now;
      size();
      mouse.x += (mouse.tx - mouse.x) * .06; mouse.y += (mouse.ty - mouse.y) * .06; mouse.i += (mouse.ti - mouse.i) * .04;
      gl.viewport(0, 0, cv.width, cv.height);
      gl.uniform2f(u.R, cv.width, cv.height);
      gl.uniform1f(u.A, photo.w / photo.h);
      gl.uniform1f(u.W, photo.water);
      gl.uniform1f(u.t, (now - t0) / 1000);
      gl.uniform2f(u.M, mouse.x, mouse.y);
      gl.uniform1f(u.Mi, mouse.i);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      raf = requestAnimationFrame(frame);
    }
    function start() { if (!running && photo && visible) { running = true; raf = requestAnimationFrame(frame); } }
    return {
      show(p, img) {
        if (!p.water) { cv.classList.remove("on"); photo = null; return; }
        const go = () => {
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
          photo = p; start();
          requestAnimationFrame(() => cv.classList.add("on"));
        };
        img.complete && img.naturalWidth ? go() : img.addEventListener("load", go, { once: true });
      },
    };
  })();

  heroInfo(heroPicks[0]);
  // the title sits on the lake's waterline and is mirrored into the water below it
  const mirror = $("#mirror"), heroSec = $(".hero");
  function placeMirror() {
    const p = heroPicks[0], wl = p.water || .6;
    const W = heroSec.clientWidth, H = heroSec.clientHeight;
    const s = Math.max(W / p.w, H / p.h), dh = p.h * s;
    let y = wl * dh - (dh - H) * .4;
    y = H / 2 + (y - H / 2) * 1.1; // the photo's slow zoom
    const lo = H * .3, hi = H - (heroSec.querySelector(".hero-foot").offsetHeight + mirror.querySelector("h1").offsetHeight * .9);
    const at = Math.max(lo, Math.min(hi, y));
    heroSec.style.setProperty("--wl", Math.round(at) + "px");
    mirror.classList.toggle("dry", Math.abs(at - y) > 40); // too short a screen to reach the water: no reflection
  }
  placeMirror(); addEventListener("resize", placeMirror);
  // the headline rotates through these lines; each is split into letters (with its reflection) so it can fade letter by letter
  const LINES = ["Every frame, a thousand words.", "Lenses, perfectly focused.", "See the world."];
  function setLine(text) {
    mirror.querySelectorAll(".hero-title").forEach((el) => {
      let i = 0;
      if (el.tagName === "H1") el.setAttribute("aria-label", text);
      el.innerHTML = text.split(" ").map((w) => `<span class="w" aria-hidden="true">${[...w].map((c) => `<span class="ch" style="--i:${i++}">${c}</span>`).join("")}</span>`).join(" ");
    });
    placeMirror();
  }
  setLine(LINES[0]);
  if (!reduce) {
    let line = 0;
    const next = () => {
      const out = 800 + mirror.querySelector("h1").textContent.length * 24;
      mirror.classList.remove("in"); mirror.classList.add("out");
      setTimeout(() => {
        line = (line + 1) % LINES.length; setLine(LINES[line]);
        mirror.classList.remove("out"); void mirror.offsetWidth; mirror.classList.add("in");
      }, out);
    };
    setTimeout(() => { next(); setInterval(next, 10000); }, 10000);
  }
  document.fonts && document.fonts.ready.then(placeMirror);
  living && living.show(heroPicks[0], heroImgs[0]);
  // warm the next photos once the first one is up
  addEventListener("load", () => heroImgs.forEach((im) => { if (im.dataset.src) { im.src = im.dataset.src; delete im.dataset.src; } }));

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = (v) => Math.min(1, Math.max(0, v));

  function onScroll() { bendFrames(); }
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll);
  addEventListener("load", onScroll);

  /* ——— work: one reel ordered by colour, each photo whole, at its own proportions ——— */
  const frames = [];
  const reel = document.createElement("div"); reel.className = "reel"; $("#cats").appendChild(reel);
  shots.forEach((p, i) => {
    const fig = document.createElement("figure"); fig.className = "item";
    fig.style.setProperty("--r", (p.w / p.h).toFixed(4));
    if (p.w / p.h > 1.6) fig.classList.add("wide");
    const b = document.createElement("button");
    b.type = "button"; b.className = "frame"; b.style.setProperty("--tone", p.tone);

  function openLb(which, i, name) {
    lastFocus = document.activeElement; listName = name || "";
    if (list !== which || !strip.children.length) { list = which; fillStrip(); }
    lb.classList.add("open"); document.documentElement.style.overflow = "hidden";
    cur.style.setProperty("--cs", 0);
    show(i); $("#lbClose").focus();
  }
  function closeLb() {
    lb.classList.remove("open"); document.documentElement.style.overflow = "";
    lastFocus && lastFocus.focus();
  }
  $("#lbClose").onclick = closeLb;
  $("#lbPrev").onclick = () => show(idx - 1);
  $("#lbNext").onclick = () => show(idx + 1);
  addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) {
      return;
    }
    if (e.key === "Escape") closeLb();
    if (e.key === "ArrowRight") show(idx + 1);
    if (e.key === "ArrowLeft") show(idx - 1);
  });
  let sx = null;
  $("#lbStage").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
  $("#lbStage").addEventListener("touchend", (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
  });
})();
</script>
